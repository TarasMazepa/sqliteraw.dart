name: sample-flutter-test.yml

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  sample-flutter-test:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04-arm
            channel: master
          - os: ubuntu-latest
            channel: stable
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - id: get-flutter-version
        run: echo "flutter_version=$(cat FLUTTER_VERSION)" >> $GITHUB_OUTPUT

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.get-flutter-version.outputs.flutter_version }}
          channel: ${{ matrix.channel }}

      - run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - run: dart pub get
        working-directory: sqliteraw

      - run: dart run ffigen
        working-directory: sqliteraw

      - run: flutter pub get
        working-directory: sample/flutter

      - run: flutter test
        working-directory: sample/flutter
